server.port=8096

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/expense_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:SmartExpenseManagerSecretKey2024VeryLongSecretKeyForJWTTokenGeneration}
app.jwt.expiration=86400000

logging.level.org.springframework.security=INFO
